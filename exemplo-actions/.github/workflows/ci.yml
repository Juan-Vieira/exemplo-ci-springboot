name: Exemplo de CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout code

      - uses: actions/setup-java@v4
      - name: Set up JDK 17
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Gradle
    run: mvn -B package -DskipTests